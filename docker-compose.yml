version: '3.8'

services:
  # ========== BASE DE DATOS POSTGRESQL ==========
  postgres:
    image: postgres:15-alpine
    container_name: callcenter_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"  # Exponer para acceso desde clientes externos (DBeaver, pgAdmin, etc.)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-callcenter}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== REDIS (Broker para Celery) ==========
  redis:
    image: redis:7-alpine
    container_name: callcenter_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== BACKEND DJANGO ==========
  backend:
    build: ./backend
    container_name: callcenter_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Django
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-this-in-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      
      # Base de datos
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-callcenter}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_HOST: postgres
      DB_PORT: 5432
      
      # Control de migraciones
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
      
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      
      # AssemblyAI
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8000:8000"

  # ========== CELERY WORKER ==========
  celery-worker:
    build: ./backend
    container_name: callcenter_celery_worker
    restart: unless-stopped
    entrypoint: []
    command: celery -A callcenter worker -l info -P eventlet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-this-in-production}
      DEBUG: ${DEBUG:-False}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-callcenter}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_HOST: postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}

  # ========== CELERY BEAT (Tareas programadas) ==========
  celery-beat:
    build: ./backend
    container_name: callcenter_celery_beat
    restart: unless-stopped
    entrypoint: []
    command: celery -A callcenter beat -l info
    depends_on:
      - redis
      - celery-worker
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-this-in-production}
      DEBUG: ${DEBUG:-False}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-callcenter}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_HOST: postgres
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

  # ========== FRONTEND REACT + NGINX ==========
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: callcenter_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # ========== NGROK (Túnel para webhooks de Twilio) ==========
  ngrok:
    image: ngrok/ngrok:latest
    container_name: callcenter_ngrok
    restart: unless-stopped
    command: http backend:8000 --log stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"  # Panel de ngrok para ver la URL
    depends_on:
      - backend

volumes:
  postgres_data:
    name: callcenter_postgres_data
  backend_static:
    name: callcenter_static
  backend_media:
    name: callcenter_media
